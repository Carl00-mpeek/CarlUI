[package]
name = "carlui-vault-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Carl Vault for Linux (KDE Plasma / Wayland): window + browser bridge"

[[bin]]
name = "carl-vault"
path = "src/main.rs"

[dependencies]
carlui-vault = { path = "../carlui-vault" }
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
getrandom = "0.2"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
rfd = "0.15"
