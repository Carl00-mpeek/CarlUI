[package]
name = "carlui-island"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "carlui-island"
path = "src/main.rs"

[dependencies]
carlui-clip = { path = "../carlui-clip" }
carlui-core.workspace = true
carlui-launcher = { path = "../carlui-launcher" }
carlui-sys = { path = "../carlui-sys" }
carlui-ui.workspace = true
rqrr = { version = "0.11.0", default-features = false }
serde_json.workspace = true
windows.workspace = true
zeroize = "1"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
