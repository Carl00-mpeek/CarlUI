[package]
name = "carlui-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "CarlUI-Setup"
path = "src/main.rs"

[dependencies]
carlui-core.workspace = true
carlui-ui.workspace = true
windows.workspace = true
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[build-dependencies]
zstd = { version = "0.14", default-features = false, features = ["zstdmt"] }

# Yalnızca kaldırıcıyı (CarlUI-Uninstall.exe) üretir: payload gömülmez.
[features]
uninstaller = []
