[workspace]
resolver = "2"
members = ["crates/carlui-core", "crates/carlui-ui", "crates/carlui", "crates/carlui-dock", "crates/carlui-tray", "crates/carlui-island", "crates/carlui-launcher", "crates/carlui-clip", "crates/carlui-sys", "crates/carlui-sensors", "crates/carlui-taskmgr", "crates/carlui-convert", "crates/carlui-settings", "crates/carlui-start", "crates/carlui-setup", "crates/carlui-vault",
    "crates/carlui-remover", "crates/carlui-office", "crates/carlui-tools", "crates/carlui-expand", "crates/carlui-replay", "crates/carlui-ai"]

[workspace.package]
version = "0.9.5"
edition = "2021"
license = "MIT"
authors = ["Demhat Dayan <maildemhat@gmail.com>"]

[workspace.dependencies]
carlui-core = { path = "crates/carlui-core" }
carlui-ui = { path = "crates/carlui-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_WinTrust",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Variant",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_Graphics_DirectWrite",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Networking_WinHttp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Devices",
    "Devices_Radios",
    "ApplicationModel",
    "Media",
    "Media_Control",
    "Media_Core",
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Web",
    "Web_Http",
    "Web_Http_Headers",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Hafiflik: küçük binary, hızlı başlangıç
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
